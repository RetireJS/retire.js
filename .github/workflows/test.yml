name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [24.x, 26.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
        working-directory: node
      - run: npm run build
        working-directory: node
      - run: npm test
        working-directory: node
      - run: npm run typecheck
        working-directory: node
      - run: node node_modules/eslint/bin/eslint.js . --ext .ts --ignore-path ../.gitignore
        working-directory: node
      - run: npm ci
        working-directory: chrome/build
      - run: npm test
        working-directory: chrome/build
      - run: npm run build
        working-directory: chrome/build
      - name: Verify prebuilt extensions match source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all -- dist)"
      - run: node validate
        working-directory: repository
      - name: Restore cached data for test-detection
        uses: actions/cache@v4
        id: cache-testdata
        with:
          path: repository/tmp
          key: ${{ runner.os }}-test-detection-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-test-detection-
      - run: node test-detection.js
        working-directory: repository
