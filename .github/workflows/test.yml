name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [24.x, 26.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
        working-directory: node
      - run: npm run build
        working-directory: node
      - run: npm test
        working-directory: node
      - run: npm run typecheck
        working-directory: node
      - run: node node_modules/eslint/bin/eslint.js .
        working-directory: node
      - run: npm ci
        working-directory: chrome/build
      - run: npm test
        working-directory: chrome/build
      - run: npm run build
        working-directory: chrome/build
      - run: node validate
        working-directory: repository

  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      outside-repository: ${{ steps.files.outputs.outside-repository }}
    steps:
      - name: Check whether the PR changes anything outside repository/
        id: files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -qv '^repository/'; then
            echo "outside-repository=true" >> "$GITHUB_OUTPUT"
          else
            echo "outside-repository=false" >> "$GITHUB_OUTPUT"
          fi

  prebuilt:
    # Skipped for PRs that only touch repository/ (e.g. advisory auto-updates).
    needs: changes
    if: needs.changes.outputs.outside-repository == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Compare packages with their own sources, before merging master updates.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci
        working-directory: node
      - run: npm run build
        working-directory: node
      - run: npm ci
        working-directory: chrome/build
      - run: npm run build
        working-directory: chrome/build
      - name: Verify prebuilt extensions match source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all -- chrome/extension chrome/extension-no-func dist/firefox)"

  detection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci
        working-directory: node
      - run: npm run build
        working-directory: node
      - name: Restore cached data for test-detection
        uses: actions/cache@v4
        id: cache-testdata
        with:
          path: repository/tmp
          key: ${{ runner.os }}-test-detection-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-test-detection-
      - run: node test-detection.js
        working-directory: repository
